schemaVersion: 1
action: ios.pbxproj-registered
summary: 新增的 .swift 文件必须已在 project.pbxproj 注册
incident: |
  2026-11-2x：新文件没在 pbxproj 注册，本地能编译（Xcode 自动加），
  但 git 里没带上 .xcodeproj，别人拉下来直接编译失败。已踩两次。
requires: []
params:
  repo: .
fixture:
  dirty: /root/ops/fixtures/ios-dirty
  clean: /root/ops/fixtures/ios-clean
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 30
    run: bash /root/ops/checks/ios-guard.sh pbxproj {{repo}}
