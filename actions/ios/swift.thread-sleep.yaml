schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.thread-sleep
summary: 禁止在主线程 sleep
incident: |
  Thread.sleep 卡住主线程，轻则掉帧重则被看门狗杀掉。等待要用 async/await 或回调。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.thread-sleep {{repo}}
