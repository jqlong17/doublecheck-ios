schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.localhost-url
summary: 代码里不要写死 127.0.0.1 / localhost
incident: |
  写死 localhost 的代码在真机上永远连不上：模拟器正常、装到手机就废。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.localhost-url {{repo}}
