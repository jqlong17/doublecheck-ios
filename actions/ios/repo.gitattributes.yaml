schemaVersion: 1
kind: policy
stage: commit
area: project
domain: engineering
action: repo.gitattributes
summary: 建议有 .gitattributes 处理二进制与换行
incident: |
  没有 .gitattributes，插图/字体被当成文本 diff，Windows 协作还会整文件变更。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.gitattributes {{repo}}
