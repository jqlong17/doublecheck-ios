schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: quality
action: plist.bundle-id-match
summary: Info.plist 的 bundle id 必须与工程设置一致
incident: |
  两处不一致时，装出来的包标识可能不是你以为的那个，推送与签名都会错乱。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py plist.bundle-id-match {{repo}}
