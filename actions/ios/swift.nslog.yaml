schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.nslog
summary: 用 Logger 替代 NSLog
incident: |
  NSLog 不进 unified logging 的子系统分类，线上收集不到也过滤不了。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.nslog {{repo}}
