schemaVersion: 1
kind: policy
stage: release
area: project
domain: delivery
action: git.tag-matches-version
summary: git tag 必须与版本号一致
incident: |
  tag 和 Info.plist 版本不一致时，回溯「这一版发了什么」会直接对错版本。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py git.tag-matches-version {{repo}}
