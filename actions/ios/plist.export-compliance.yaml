schemaVersion: 1
kind: invariant
stage: release
area: project
domain: delivery
action: plist.export-compliance
summary: 必须声明出口合规（否则每次上传都被问）
incident: |
  ITSAppUsesNonExemptEncryption 不写，每次上传 App Store 都会卡在合规提问，白等一轮。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py plist.export-compliance {{repo}}
