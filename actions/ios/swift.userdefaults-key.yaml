schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.userdefaults-key
summary: UserDefaults 的 key 不要用裸字符串
incident: |
  拼错的 key 读出来是 nil，不报错也不崩。集中定义常量才能防呆。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.userdefaults-key {{repo}}
