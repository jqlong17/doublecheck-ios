schemaVersion: 1
action: ios.no-secrets
summary: 代码和脚本里不能出现 token、私钥、云密钥
incident: |
  AGENTS.md 硬性禁止：不要把公网地址、token、凭证写进代码或日志。
  历史上已因此重写过一次 git 历史——代价远大于一条检查。
requires: []
params:
  repo: .
fixture:
  dirty: /root/ops/fixtures/ios-dirty-secrets
  clean: /root/ops/fixtures/ios-clean-secrets
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 30
    run: bash {{ops_dir}}/checks/ios-guard.sh secrets {{repo}}
