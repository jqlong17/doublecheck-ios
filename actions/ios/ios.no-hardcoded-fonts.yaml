schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: ios.no-hardcoded-fonts
summary: 禁止 .system(size:) 硬编码字号
incident: |
  交互规范明确禁止：硬编码字号在动态字体和不同设备上不一致。
  人眼 review 经常漏，所以做成机器检查。
requires: []
params:
  repo: .
fixture:
  dirty: /root/ops/fixtures/ios-dirty
  clean: /root/ops/fixtures/ios-clean
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 30
    run: bash {{ops_dir}}/checks/ios-guard.sh fonts {{repo}}
