schemaVersion: 1
kind: policy
stage: commit
area: project
domain: engineering
action: repo.readme
summary: 仓库要有 README
incident: |
  没有 README 的仓库，别人（和三个月后的你）都不知道这玩意儿怎么跑。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.readme {{repo}}
