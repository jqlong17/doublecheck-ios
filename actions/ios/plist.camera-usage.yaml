schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: quality
action: plist.camera-usage
summary: 用到相机就必须有相机用途说明
incident: |
  缺 NSCameraUsageDescription 时，一调相机 App 直接崩，而且崩溃信息只说是隐私权限。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py plist.camera-usage {{repo}}
