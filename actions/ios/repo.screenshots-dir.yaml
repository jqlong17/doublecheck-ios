schemaVersion: 1
kind: policy
stage: release
area: project
domain: engineering
action: repo.screenshots-dir
summary: 商店截图要有固定目录
incident: |
  发版时截图散落在桌面，最后拼错版本或尺寸。固定目录 + 命名规范能省一次返工。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.screenshots-dir {{repo}}
