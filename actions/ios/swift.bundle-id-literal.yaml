schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.bundle-id-literal
summary: 代码里不要写死 bundle id
incident: |
  写死 bundle id 后，换测试包或改标识的构建会静默用错值。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.bundle-id-literal {{repo}}
