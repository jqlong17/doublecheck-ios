schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: engineering
action: ios.secret-files-ignored
summary: 签名证书与密钥文件不能被提交
incident: |
  App Store Connect 的 .p8、发布证书 .p12 一旦进了 git，
  即使删掉也留在历史里——只能重写历史并吊销证书。
requires: []
params:
  repo: .
fixture:
  dirty: /root/ops/fixtures/ios-eng-dirty
  clean: /root/ops/fixtures/ios-eng-clean
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 20
    run: bash {{ops_dir}}/checks/ios-guard.sh secret-files-ignored {{repo}}
