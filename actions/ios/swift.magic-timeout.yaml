schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.magic-timeout
summary: 网络超时不要写魔法数字
incident: |
  随手写 timeout: 30 的代码换网络环境就出问题；超时应该集中定义、可配置。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.magic-timeout {{repo}}
