schemaVersion: 1
kind: policy
stage: commit
area: project
domain: engineering
action: repo.editorconfig
summary: 建议有 .editorconfig
incident: |
  没有统一缩进/换行配置，跨编辑器协作会产生大量纯格式 diff。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.editorconfig {{repo}}
