schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.hardcoded-color
summary: 禁止 Color(red:green:blue:) 硬编码颜色
incident: |
  硬编码颜色在深色模式和不同设备上不一致，也过不了设计规范。用语义颜色或 asset catalog。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.hardcoded-color {{repo}}
