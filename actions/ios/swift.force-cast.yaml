schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.force-cast
summary: 禁止 as!（类型不符直接崩）
incident: |
  服务端字段类型一变，as! 立刻崩溃；同一处用 as? 加默认值，最坏只是显示异常。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.force-cast {{repo}}
