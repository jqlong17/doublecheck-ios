schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: engineering
action: repo.spm-resolved
summary: Package.resolved 要提交
incident: |
  不提交 Package.resolved，每个人解析到的依赖版本不同，会出现「我这儿能编译你那儿不行」。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.spm-resolved {{repo}}
