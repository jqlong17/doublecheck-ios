schemaVersion: 1
kind: policy
stage: release
area: project
domain: delivery
action: git.branch-main
summary: 发版应该从主分支出
incident: |
  从功能分支发版，主分支和线上版本会长期分叉，下一次合并必然冲突。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py git.branch-main {{repo}}
