schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: engineering
action: repo.large-file
summary: 不要提交大于 2MB 的文件
incident: |
  大文件进 git 后永远留在历史里，clone 越来越慢，删掉也没用。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.large-file {{repo}}
