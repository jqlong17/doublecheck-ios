schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.fatal-error
summary: 生产代码里不要 fatalError
incident: |
  fatalError 在 Release 里同样是崩溃。当作「不该发生」的兜底可以理解，但每一条都是潜在闪退点。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.fatal-error {{repo}}
