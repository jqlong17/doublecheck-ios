schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.print
summary: 生产代码里不要用 print 打日志
incident: |
  print 不走 unified logging，正式包里既看不到也过滤不了，线上排查时等于没有日志。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.print {{repo}}
