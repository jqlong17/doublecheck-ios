schemaVersion: 1
kind: policy
stage: release
area: project
domain: engineering
action: repo.changelog
summary: 要有 CHANGELOG
incident: |
  发版时最常被问「这版改了什么」。没有 CHANGELOG 就只能翻 commit 记录。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py repo.changelog {{repo}}
