schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: swift.dispatch-main-sync
summary: 不要在主线程序列上同步等待
incident: |
  在主线程同步等一个后台任务，就是死锁的标准配方。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py swift.dispatch-main-sync {{repo}}
