schemaVersion: 1
kind: invariant
stage: commit
area: project
domain: quality
action: plist.ats-arbitrary
summary: 不要开启 ATS 的任意加载
incident: |
  NSAllowsArbitraryLoads=true 会让全部明文请求放行，等于关掉 iOS 的传输安全，审核也会问。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py plist.ats-arbitrary {{repo}}
