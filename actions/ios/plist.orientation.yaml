schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: plist.orientation
summary: 必须声明支持的屏幕方向
incident: |
  UISupportedInterfaceOrientations 缺失时，iPad 上可能被强制横屏，布局全乱。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py plist.orientation {{repo}}
