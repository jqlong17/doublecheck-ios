schemaVersion: 1
kind: policy
stage: commit
area: project
domain: quality
action: git.no-wip-commit
summary: 最后一次提交不要是 WIP
incident: |
  WIP 提交进主干后，回滚和二分定位都会变得很痛苦。
requires: []
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py git.no-wip-commit {{repo}}
