schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.journald-limit
summary: journald 必须配置容量上限
incident: |
  不设上限时 journal 能把磁盘吃满，然后所有服务一起挂。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.journald-limit {{repo}}
