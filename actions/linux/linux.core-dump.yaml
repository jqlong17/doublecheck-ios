schemaVersion: 1
kind: policy
stage: operate
area: system
domain: runtime
action: linux.core-dump
summary: 生产机应关闭 core dump
incident: |
  core dump 会把内存写到磁盘，既可能泄露密钥，又可能瞬间写满分区。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.core-dump {{repo}}
