schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.disk-inode
summary: inode 使用率不能超过 80%
incident: |
  磁盘还有空间但 inode 用尽是常见的隐蔽故障：写文件报 No space left on device。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.disk-inode {{repo}}
