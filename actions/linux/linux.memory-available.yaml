schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.memory-available
summary: 可用内存不能低于 200MB
incident: |
  可用内存见底时，内核开始杀进程，最先死的往往是数据库或代理。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.memory-available {{repo}}
