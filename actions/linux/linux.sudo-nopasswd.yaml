schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.sudo-nopasswd
summary: 禁止无密码 sudo ALL
incident: |
  NOPASSWD: ALL 等于给任何拿到账号的人直接 root，一条命令就能清空机器。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.sudo-nopasswd {{repo}}
