schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.time-sync
summary: 系统时间必须同步
incident: |
  时间不同步会让 TLS 校验失败、JWT 过期判定错乱，排查时还看不出来是时间问题。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.time-sync {{repo}}
