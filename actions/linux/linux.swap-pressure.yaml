schemaVersion: 1
kind: policy
stage: operate
area: system
domain: runtime
action: linux.swap-pressure
summary: swap 使用率不能超过 50%
incident: |
  swap 用得多说明内存长期不足，性能会断崖式下降，而监控上 CPU 可能一切正常。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.swap-pressure {{repo}}
