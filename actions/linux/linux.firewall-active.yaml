schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.firewall-active
summary: 防火墙必须处于启用状态
incident: |
  云主机的安全组是第一层，本机防火墙是第二层；只依赖一层时，配错一次就全暴露。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.firewall-active {{repo}}
