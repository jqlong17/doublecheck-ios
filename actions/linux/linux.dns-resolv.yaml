schemaVersion: 1
kind: invariant
stage: operate
area: system
domain: runtime
action: linux.dns-resolv
summary: DNS 解析必须正常
incident: |
  DNS 挂了表现为「网络全断」，但 ping IP 又是通的，最容易误判成上游故障。
requires: [linux]
params:
  repo: .
preconditions: []
steps:
  - kind: noop
postconditions:
  - kind: cmd.exit0
    timeout_s: 60
    run: python3 {{ops_dir}}/checks/rules.py linux.dns-resolv {{repo}}
