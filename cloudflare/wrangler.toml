# doublecheck 用量统计（Cloudflare Workers + D1）
# 部署：
#   cd cloudflare
#   npx wrangler d1 create doublecheck        # 记下 database_id
#   npx wrangler d1 execute doublecheck --remote --file=./schema.sql
#   npx wrangler deploy
name = "doublecheck-dash"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "doublecheck"
database_id = "e7d73982-68af-405f-a4ac-64e5ecf8f036"

# workers.dev 在国内经常不可达，挂到自定义域名上（需要域名在同一个 Cloudflare 账号）
[[routes]]
pattern = "api.notta.uk"
zone_name = "notta.uk"
custom_domain = true
